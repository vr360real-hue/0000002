<!DOCTYPE html>
<html lang="ru" style="--gold: #ffdb4d; --gold-rgb: 255,219,77; --pr: 0px; --bg: #05070c;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>360° Сфера · Плакат · Осадки</title>
<style>
:root{--gold:#ffdb4d;--gold-rgb:255,219,77;--bg:#05070c;--pr:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#e9e9e9;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  user-select:none;-webkit-user-select:none}
body{font-size:0}
body > *:not(#app):not(script){display:none!important}
#app{position:fixed;inset:0;font-size:16px;overflow:hidden}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none;
  perspective:800px;perspective-origin:50% 50%;background:transparent;
  transform-style:preserve-3d;z-index:2}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}

#snowCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;display:block;}

#billboardContainer {
  position: absolute; left: 50%; top: 50%;
  transform-style: preserve-3d; display: none; pointer-events: none;
}
.billboard-side {
  position: absolute; left: 0; top: 0;
  width: min(600px, 40vmax); height: min(600px, 40vmax);
  transform-origin: 0 0;
  backface-visibility: hidden;
  pointer-events: auto;
  background: transparent;
  box-shadow: none;
  border-radius: 0;
  overflow: visible;
}
.billboard-side:hover,
.billboard-side.focused {
  box-shadow: none !important;
  border-radius: 0 !important;
}
.billboard-side img, .billboard-side video {
  width: 100%; height: 100%; object-fit: contain;
  pointer-events: none;
  image-rendering: auto;
  border-radius: 0;
  box-shadow: none;
}
#bbFront { transform: translate(-50%, -50%) translateZ(1px); }
#bbBack  { transform: rotateY(180deg) translate(-50%, -50%) translateZ(1px); }

.photo{position:absolute;overflow:visible;background:transparent}
.photo .media{position:relative;width:100%;height:100%;overflow:hidden;
  background:#101828;border-radius:var(--pr,0px);
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 6px 24px rgba(0,0,0,.55);
  transition:box-shadow .2s ease}
.photo:hover .media{box-shadow:0 0 0 2px var(--gold),0 10px 34px rgba(0,0,0,.7)}
.photo.focused .media{box-shadow:0 0 0 3px var(--gold),0 0 80px rgba(var(--gold-rgb),.4)}
.photo.focused{transition:width .34s cubic-bezier(.25,.8,.25,1),height .34s cubic-bezier(.25,.8,.25,1),
             left .34s cubic-bezier(.25,.8,.25,1),top .34s cubic-bezier(.25,.8,.25,1),
             transform .34s cubic-bezier(.25,.8,.25,1),
             opacity .28s ease;z-index:9}
.photo.dragging-photo{z-index:20;transition:none!important}
.photo.dragging-photo .media{box-shadow:0 0 0 3px var(--gold),0 0 60px rgba(var(--gold-rgb),.6)}
.photo .media img, .photo .media video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  pointer-events:none;-webkit-user-drag:none;transition: opacity .6s ease;
}
.photo .media img{opacity:0;z-index:1;}
.photo .media img.img-visible{ opacity:1; }
.photo .media img.img-top{ z-index:2; }
.photo .media video{ display:none; z-index:3; }
.photo.vid .media::before{
  content:"▶";position:absolute;top:6px;right:6px;z-index:4;pointer-events:none;
  font-size:11px;line-height:1;color:#111;background:var(--gold);
  padding:3px 6px;border-radius:999px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.photo.dim{opacity:.06;pointer-events:none}
.photo.hidden{display:none;pointer-events:none}

body.no-photo-shadows .photo .media,
body.no-photo-shadows .photo:hover .media,
body.no-photo-shadows .photo.focused .media,
body.no-photo-shadows .photo.dragging-photo .media {
  box-shadow: none !important;
}

#captions{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
.photo-caption{
  position:absolute;left:0;top:0;pointer-events:none;font-weight:700;font-size:14px;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,1),0 2px 8px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.85);
  white-space:nowrap;text-align:center;line-height:1.2;transform-origin: top center;
  transition: color .25s ease, font-size .2s ease;will-change: transform;
}
.photo-caption.focused{color:var(--gold);font-size:17px;}
.photo-caption .cap-name{ display:block; }
.photo-caption .cap-price{ display:block;font-size:0.82em;color:var(--gold);font-weight:700;margin-top:2px;letter-spacing:.3px;}
.photo-caption.focused .cap-price{ color:#fff; }

#logo{position:fixed;top:16px;left:16px;z-index:40;display:none;align-items:center;gap:10px;pointer-events:none;}
#logo.show{ display:flex; }
#logo img{height:34px;width:auto;max-width:110px;object-fit:contain;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.85));}
#logoName{font-size:14px;font-weight:700;color:#fff;letter-spacing:.4px;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.75);}

#carNav{position:fixed;top:50%;left:0;right:0;transform:translateY(-50%);display:none;pointer-events:none;z-index:400;justify-content:space-between;padding:0 16px;}
#carNav.show{ display:flex; }
.car-btn{pointer-events:auto;width:52px;height:52px;border-radius:50%;background:rgba(14,18,26,.9);color:var(--gold);font-size:30px;font-weight:700;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);border:1px solid rgba(var(--gold-rgb),.3);box-shadow:0 4px 16px rgba(0,0,0,.5);transition:transform .15s,background .15s;line-height:1;}
.car-btn:hover{ transform:scale(1.1);background:rgba(var(--gold-rgb),.18); }
#carDots{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:400;pointer-events:auto;padding:8px 14px;border-radius:999px;background:rgba(14,18,26,.8);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);}
#carDots.show{ display:flex; }
.car-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer;transition:background .15s,transform .15s;}
.car-dot.active{ background:var(--gold);transform:scale(1.35); }
.car-dot:hover{ background:rgba(var(--gold-rgb),.6); }

#vignette{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#panel{position:fixed;left:16px;bottom:16px;z-index:50;background:rgba(14,18,26,.94);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;font-size:12.5px;width:340px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-height:calc(100vh - 32px);overflow-y:auto}
#panel .t{font-weight:700;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
#panel .c{color:var(--gold);font-weight:700}
#panel .row{display:flex;gap:8px;align-items:center;margin-top:8px}
#panel .row label{font-size:11.5px;color:#93a4bd;min-width:64px}
#panel .row .lbl{display:flex;align-items:center;gap:6px;cursor:pointer;min-width:auto;font-size:11.5px;color:#cbd5e1}
#panel input[type=range]{flex:1;accent-color:var(--gold);height:16px}
#panel input[type=color]{width:34px;height:26px;border:1px solid #1e2a3d;background:none;padding:0;cursor:pointer;border-radius:6px;flex:0 0 auto}
#panel input[type=text]{flex:1;min-width:0;background:#070b13;border:1px solid #1e2a3d;color:#cfe3ff;border-radius:6px;padding:5px 7px;font-size:11px;font-family:inherit}
#panel input[type=number]{background:#070b13;border:1px solid #1e2a3d;color:#cfe3ff;border-radius:6px;padding:4px 6px;font-size:11px;font-family:inherit;width:72px;flex:0 0 auto}
#panel input[type=file]{flex:1;min-width:0;font-size:10.5px;color:#93a4bd}
#panel input[type=checkbox]{accent-color:var(--gold);margin:0;width:14px;height:14px;cursor:pointer}
#panel select{flex:1;min-width:0;background:#070b13;border:1px solid #1e2a3d;color:#cfe3ff;border-radius:6px;padding:5px 7px;font-size:11px;font-family:inherit;cursor:pointer}
#panel textarea{width:100%;background:#070b13;border:1px solid #1e2a3d;color:#cfe3ff;border-radius:6px;padding:6px 8px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.5;resize:vertical;min-height:50px}
#panel .intval{font-size:11px;color:var(--gold);min-width:34px;text-align:right;font-weight:700}
#panel .section{font-size:11px;color:var(--gold);font-weight:700;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
#panel .eff-info{font-size:10px;color:#93a4bd;padding-left:22px;margin-top:-4px}
#panel .eff-info b{color:var(--gold)}
#linkBtn{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:12px 24px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;z-index:500;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.6);transition:transform 0.2s,filter 0.2s;cursor:pointer;pointer-events:auto;white-space:nowrap}
#linkBtn:hover{filter:brightness(1.1);transform:translateX(-50%) scale(1.05)}
button{font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:7px 11px;border-radius:8px;border:0;background:var(--gold);color:#111;transition:.15s}
button:hover{filter:brightness(1.1)}
button.ghost{background:rgba(255,255,255,.09);color:#ddd}
button.ghost:hover{background:rgba(255,255,255,.16)}
button.danger{background:#ff6b6b;color:#111}
button.danger:hover{filter:brightness(1.1)}
button.apply{background:linear-gradient(135deg,#36d399,#1eae7a);color:#032015;font-size:14px;padding:12px 20px;border-radius:10px;font-weight:800;letter-spacing:.4px;width:100%;margin-bottom:12px;box-shadow:0 6px 20px rgba(54,211,153,.35)}
button.apply:hover{filter:brightness(1.08);transform:translateY(-1px)}
#overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,12,.88);backdrop-filter:blur(6px)}
#overlay.open{display:flex}
#overlay .card{width:min(680px,100%);max-height:90vh;overflow:auto;background:#0e1421;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#overlay h2{margin:0 0 6px;font-size:17px}
#overlay p{margin:0 0 14px;font-size:12.5px;line-height:1.55;color:#93a4bd}
#overlay code{color:#ffd66b;background:#0a0f18;padding:1px 5px;border-radius:4px;font-size:11px}
textarea{width:100%;height:110px;resize:vertical;background:#070b13;color:#cfe3ff;border:1px solid #1e2a3d;border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.55}
label{font-size:12px;color:#93a4bd;display:block;margin-bottom:4px;}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);z-index:60;padding:8px 16px;border-radius:999px;font-size:12px;background:rgba(14,18,26,.92);border:1px solid rgba(255,255,255,.12);opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
#saveOverlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;pointer-events:none}
#saveOverlay.show{display:flex}
#saveOverlay .box{background:rgba(14,18,26,.96);color:var(--gold);padding:18px 32px;border-radius:16px;font-weight:700;font-size:15px;box-shadow:0 10px 40px rgba(0,0,0,.85);border:1px solid rgba(var(--gold-rgb),.4);text-align:center;line-height:1.5;}
#saveOverlay .box small{display:block;font-size:11px;color:#93a4bd;margin-top:4px;font-weight:500;}

/* ====== 3D MODEL (Sketchfab) ====== */
#model3DContainer{position:fixed;inset:0;z-index:4;pointer-events:none;display:none;overflow:hidden}
#model3DContainer.active{display:block}
/* ХИТРОСТЬ: iframe скейлится 1.5x от центра — UI Скетчфаба уезжает за границы клипа */
#model3DIframe{position:absolute;top:50%;left:50%;width:100%;height:100%;border:0;background:transparent;display:block;pointer-events:none;overflow:hidden;transform:translate(-50%,-50%) scale(1.5);transform-origin:center center}
#model3DContainer.interactive #model3DIframe{pointer-events:auto}
#model3DBtn{position:fixed;z-index:6;display:none;align-items:center;justify-content:center;font-weight:700;text-decoration:none;cursor:pointer;user-select:none;-webkit-user-select:none;transition:box-shadow .15s,filter .15s;box-shadow:0 6px 24px rgba(0,0,0,.4);font-family:inherit;white-space:nowrap;text-align:center;padding:6px 14px;box-sizing:border-box;border:0;overflow:hidden}
#model3DBtn.active{display:flex}
#model3DBtn:hover{filter:brightness(1.08)}
#model3DBtn.dragging{cursor:grabbing;transition:none}
#model3DBtnInner{display:block;width:100%;white-space:pre-wrap;word-break:break-word;line-height:1.25;overflow-wrap:anywhere;}
#stage.interactive{pointer-events:none !important}
#stage.interactive .photo{pointer-events:auto !important}
#stage.interactive .billboard-side{pointer-events:auto !important}
</style>
</head>

      targetW = potW; targetH = potH;
    }

  var c = document.createElement('canvas');
  c.width = targetW; c.height = targetH;
  var ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
  if(flipX){ ctx.translate(targetW, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, 0, 0, targetW, targetH);
  return c;
}

function loadPanoTexture(url){
  if(!panoGL){ initPanoGL(); }
  if(!panoGL) return;
  if(!url){ panoTexReady = false; panoTexUrl=''; panoSourceImg=null; drawPano(); return; }
  if(url === panoTexUrl && panoTexReady) return;
  panoTexUrl = url; panoTexReady = false; drawPano();
  var img = new Image(); img.crossOrigin = 'anonymous';
  img.onload = function(){
    if(panoTexUrl !== url) return;
    var gl = panoGL; if(!gl) return;
    try{
      panoSourceImg = img;
      var src = preparePanoTexture(img, panoMaxTexSize, cfg.panoFlipX);
      if(!src) return;
      if(panoTex) gl.deleteTexture(panoTex);
      panoTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, panoTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      var tw = src.width || src.naturalWidth;
      var th = src.height || src.naturalHeight;
      var canMipmap = panoIsWebGL2 || (isPowerOf2(tw) && isPowerOf2(th));
      if(canMipmap){
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      } else {
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      }
      if(panoAnisoExt){
        var maxAniso = gl.getParameter(panoAnisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
        gl.texParameterf(gl.TEXTURE_2D, panoAnisoExt.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(16, maxAniso));
      }
      panoTexReady = true; drawPano();
    }catch(err){ console.warn('pano texture upload failed:', err); }
  };
  img.onerror = function(){ console.warn('pano load failed:', url); };
  img.src = url;
}

function drawPano(){
  var gl = panoGL; if(!gl || !panoCanvas) return;
  var w = window.innerWidth, h = window.innerHeight;
  var cw = Math.max(1, Math.floor(w*DPR)), ch = Math.max(1, Math.floor(h*DPR));
  if(panoCanvas.width !== cw || panoCanvas.height !== ch){
    panoCanvas.width = cw; panoCanvas.height = ch;
    panoCanvas.style.width = w+'px'; panoCanvas.style.height = h+'px';
  }
  gl.viewport(0, 0, cw, ch);
  var rgb = hexToRgb(cfg.bgColor);
  gl.clearColor(rgb[0]/255, rgb[1]/255, rgb[2]/255, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if(!panoTexReady || !panoTex) return;
  var aspect = w/h;
  var fovY = 2*Math.atan((h/2)/Math.max(1,P));
  if(fovY > Math.PI*0.9) fovY = Math.PI*0.9;
  if(fovY < 0.02) fovY = 0.02;
  var proj = perspectiveM(fovY, aspect, 0.1, 100);
  var pitchR = pitch * Math.PI/180, yawR = yaw * Math.PI/180;
  var mv = mulMat4(rotXm(-pitchR), rotYm(yawR));
  gl.useProgram(panoProg);
  gl.uniformMatrix4fv(panoProg.projLoc, false, proj);
  gl.uniformMatrix4fv(panoProg.mvLoc, false, mv);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, panoTex);
  gl.uniform1i(panoProg.texLoc, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, panoVBO);
  gl.enableVertexAttribArray(panoProg.aPosLoc);
  gl.vertexAttribPointer(panoProg.aPosLoc, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(panoProg.aUVLoc);
  gl.vertexAttribPointer(panoProg.aUVLoc, 2, gl.FLOAT, false, 20, 12);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, panoIBO);
  gl.drawElements(gl.TRIANGLES, panoNumIndices, panoIBOType, 0);
}

function setPano(url, forceReload){
  cfg.bgUrl = url || '';
  if(forceReload){
    panoTexUrl = ''; panoTexReady = false; panoSourceImg = null;
    if(panoTex && panoGL){ try{ panoGL.deleteTexture(panoTex); }catch(e){} panoTex = null; }

function scheduleFirstSwap(slot){
  if(!slot || !slot.currentPhoto || slot.currentPhoto.isVideo) return;
  if(!slot.currentPhoto.urls || slot.currentPhoto.urls.length <= 1) return;
  slot.nextSwapAt = performance.now() + 300 + Math.random() * Math.max(1000, (cfg.poolMax||12)*1000);
}
function scheduleNextSwap(slot){
  var minMs = Math.max(1000, (cfg.poolMin||3)*1000);
  var maxMs = Math.max(minMs+500, (cfg.poolMax||12)*1000);
  slot.nextSwapAt = performance.now() + minMs + Math.random()*(maxMs-minMs);
}
function tickPoolSwaps(now){
  if(!cfg.autoPool) return;
  for(var i=0;i<pool.length;i++){
    var s = pool[i], p = s.currentPhoto;
    if(!p || s === focusedSlot || p.isVideo) continue;
    if(s.el.classList.contains('hidden') || s.el.classList.contains('dim') || s.el.classList.contains('broken')) continue;
    if(!p.urls || p.urls.length <= 1) continue;
    if(!s.nextSwapAt){ scheduleFirstSwap(s); continue; }
    if(now < s.nextSwapAt) continue;
    p._carIdx = ((p._carIdx||0) + 1) % p.urls.length;
    smoothSwap(s, p.urls[p._carIdx]);
    scheduleNextSwap(s);

}

function smoothSwap(slot, newSrc){
  if(!slot) return;
  var p = slot.currentPhoto;
  if(!p || p.isVideo) return;
  if(slot.img.getAttribute('src') === newSrc) return;
  if(slot === focusedSlot){
    slot.img.src = newSrc; slot.img.classList.add('img-visible');
    if(slot.img2) slot.img2.classList.remove('img-visible');
    return;
  }
  var img2 = slot.img2;
  if(!img2){ slot.img.src = newSrc; slot.img.classList.add('img-visible'); return; }
  var token = (slot._swapToken || 0) + 1;
  slot._swapToken = token;
  var done = false;
  function applySwitch(){
    if(done) return; done = true;
    if(slot._swapToken !== token || slot.currentPhoto !== p) return;
    img2.classList.add('img-visible');
    slot.img.classList.remove('img-visible');
    setTimeout(function(){
      if(slot._swapToken !== token || slot.currentPhoto !== p) return;
      slot.img.src = newSrc; slot.img.classList.add('img-visible');
      img2.classList.remove('img-visible');
      setTimeout(function(){
        if(slot._swapToken !== token) return;
        if(!img2.classList.contains('img-visible')) img2.removeAttribute('src');
      }, 650);
    }, 620);
  }
  img2.onload = applySwitch;
  img2.onerror = function(){ img2.onerror = null; };
  img2.src = newSrc;
  if(img2.complete && img2.naturalWidth > 0) applySwitch();
}

function splitUrls(s){
  s = String(s || '').trim(); if(!s) return [];
  if(s.indexOf(';;') === -1) return [s];
  var arr = s.split(';;'), out = [];
  for(var i=0;i<arr.length;i++){ var p = arr[i].trim(); if(p) out.push(p); }
  return out.length ? out : [s];
}
function parseLine(line){
  line = String(line || '').trim(); if(!line) return null;
  var parts = line.split('|').map(function(s){ return s.trim(); });
  var urls = splitUrls(parts[0] || '');
  var vid = isVideoFlag(parts[3]) || isVideoFlag(parts[4]);
  var caption = (parts[3] && !isVideoFlag(parts[3])) ? parts[3] : '';
  var price = parts[5] || '';
  if(!price && parts[4] && !isVideoFlag(parts[4])) price = parts[4];
  return { urls:urls, url:urls[0]||'', link:parts[1]||'', btnText:parts[2]||'', caption:caption, price:price, isVideo:vid };
}
function normalizeItem(item){
  var rawUrl = String(item.url || (item.urls && item.urls[0]) || '').trim();
  var urls;

    urls = [];
    for(var i=0;i<item.urls.length;i++){
      var u = String(item.urls[i]||'').trim(); if(!u) continue;
      var parts = splitUrls(u);
      for(var j=0;j<parts.length;j++) urls.push(parts[j]);

  } else urls = splitUrls(rawUrl);
  if(!urls.length && rawUrl) urls = [rawUrl];
  var isVideo = !!item.isVideo;
  var firstUrl = urls[0] || '';
  if(/^video:/i.test(firstUrl)){ urls=[firstUrl.replace(/^video:/i,'')]; isVideo=true; }
  else if(/#video$/i.test(firstUrl)){ urls=[firstUrl.replace(/#video$/i,'')]; isVideo=true; }
  else if(!isVideo && isVideoUrl(firstUrl)){ isVideo=true; urls=[firstUrl]; }
  var out = { urls:urls, url:urls[0]||'', link:String(item.link||'').trim(),
    btnText:String(item.btnText||'').trim(), caption:String(item.caption||'').trim(),
    price:String(item.price||'').trim(), isVideo:isVideo };
  if (item._customTheta !== undefined) out._customTheta = item._customTheta;
  if (item._customPhi !== undefined) out._customPhi = item._customPhi;
  return out;
}

function createPool(){
  world.innerHTML=''; if(captionsEl) captionsEl.innerHTML='';
  pool=[];
  for(var i=0;i<POOL_SIZE;i++){
    var el=document.createElement('div'); el.className='photo hidden';
    var media=document.createElement('div'); media.className='media';
    var img=document.createElement('img'); img.alt=''; img.decoding='async'; img.referrerPolicy='no-referrer'; img.className='img-base';
    var img2=document.createElement('img'); img2.alt=''; img2.decoding='async'; img2.referrerPolicy='no-referrer'; img2.className='img-top';
    var video=document.createElement('video');
    video.muted=true; video.loop=true; video.playsInline=true;

    try{ video.disablePictureInPicture = true; }catch(e){}

    media.appendChild(img); media.appendChild(img2); media.appendChild(video);
    el.appendChild(media); el.appendChild(anchor);

    var capEl=document.createElement('div'); capEl.className='photo-caption'; capEl.style.display='none';

    (function(s){
      s.img.onload=function(){

        p.aspect=clamp(a,0.5,2.0);
        if(p===focused) applyFocusSize(); else setSlotSize(s,p);
        updateCaptionPosition(s);
      };
      s.img.onerror=function(){
        var p=s.currentPhoto; if(!p || p.isVideo) return;

        }

        showPhotoInSlot(s,p); setTimeout(refreshVideoPlayback, 60);
      };
      s.video.onloadedmetadata=function(){
        var p=s.currentPhoto; if(!p || !p.isVideo) return;
        if(!s.video.getAttribute('src')) return;
        var a=s.video.videoWidth/s.video.videoHeight;
        if(isFinite(a)&&a>0){
          p.aspect=clamp(a,0.5,2.4);
          if(p===focused) applyFocusSize(); else setSlotSize(s,p);
        }
      };
      s.video.onerror=function(){
        var p=s.currentPhoto; if(!p || !p.isVideo) return;
        if(!s.video.getAttribute('src')) return;
        s.el.classList.add('broken');
      };
    })(slot);
    pool.push(slot);
  }
}

function updateSlotCaptionText(slot){
  var p=slot.currentPhoto; if(!p || !slot.capEl) return;

}
function updateCaptionPosition(slot){

  if(slot.el.classList.contains('hidden') || slot.el.classList.contains('dim')){ slot.capEl.style.visibility='hidden'; return; }
  if(slot.capEl.style.display === 'none'){ slot.capEl.style.visibility='hidden'; return; }
  var r; try { r = slot.anchor.getBoundingClientRect(); } catch(e){ return; }
  if(!r || r.width<=0 || r.height<=0){ slot.capEl.style.visibility='hidden'; return; }
  var cx = r.left + r.width/2;
  var cy = r.top + r.height/2 + 6;

function updateAllCaptions(){ for(var i=0;i<pool.length;i++){ updateSlotCaptionText(pool[i]); updateCaptionPosition(pool[i]); } }

function showPhotoInSlot(slot, p){

function refreshCaptions(){ for(var i=0;i<pool.length;i++) updateSlotCaptionText(pool[i]); }

function refreshVideoPlayback(){
  if(!pool.length) return;
  var should=[];
  for(var i=0;i<pool.length;i++){
    var s=pool[i];
    if(!s.currentPhoto || !s.currentPhoto.isVideo) continue;
    if(s.el.classList.contains('hidden') || s.el.classList.contains('broken')) continue;
    if(s.el.classList.contains('dim') && s!==focusedSlot) continue;
    should.push(s);
  }
  should.sort(function(a,b){ return (a.currentPhoto._z2||0)-(b.currentPhoto._z2||0); });
  var playSet=[];
  for(var i=0;i<should.length;i++) if(i<MAX_VIDEOS_PLAYING || should[i]===focusedSlot) playSet.push(should[i]);
  for(var i=0;i<pool.length;i++){
    var s=pool[i];
    if(!s.currentPhoto || !s.currentPhoto.isVideo) continue;
    var want = playSet.indexOf(s)!==-1;
    if(want){ if(s.video.paused){ var pr=s.video.play(); if(pr && pr.catch) pr.catch(function(){}); } }
    else if(!s.video.paused){ try{ s.video.pause(); }catch(e){} }

}

function build(data, resetView){
  Array.prototype.slice.call(document.body.childNodes).forEach(function(n){
    if(n.nodeType===3 && n.textContent.trim()){ n.textContent=''; }
  });
  stopCarouselTimer();
  if(resetView){ yaw=0; tYaw=0; pitch=0; tPitch=0; zoomFactor = DEFAULT_ZOOM; lastInteract = performance.now(); }
  var items = [];
  if (Array.isArray(data)) {
    data.forEach(function(item) {
      if (typeof item === 'string') { var parsed = parseLine(item); if(parsed) items.push(normalizeItem(parsed)); }
      else if (item && (item.url || item.urls)) items.push(normalizeItem(item));
    });
  }
  items = items.filter(function(item){ return /^https?:\/\//i.test(item.url) || /^data:/i.test(item.url); });
  var seen = {};
  items = items.filter(function(item){ if (seen[item.url]) return false; seen[item.url] = true; return true; });
  focused=null; focusedSlot=null; allPhotos=[]; photoData=[];
  if(linkBtn) linkBtn.style.display='none';
  if(overlay) overlay.classList.remove('open');
  if(hint) hint.classList.remove('show');
  hideCarousel();
  if(countEl) countEl.textContent=items.length;
  createPool();
  if(!items.length){ applyWorld(); return; }
  var n=items.length;
  var L = n>420?4 : n>200?3 : n>70?2 : 1;
  var sumK=0, j;
  for(j=0;j<L;j++) sumK+=LK[j];
  var counts=[], tot=0;
  for(j=0;j<L;j++){ counts[j]=Math.max(1,Math.round(n*LK[j]/sumK)); tot+=counts[j]; }
  counts[0]+=n-tot;
  if(counts[0]<1 && counts[1]){ counts[0]+=counts[1]; counts[1]=0; }
  var ANG_SAFETY = 1.9;
  var ANG_CANDS = [];
  for(j=0;j<L;j++){ if(counts[j] > 0 && LR[j] > 0) ANG_CANDS.push(ANG_SAFETY / (Math.sqrt(counts[j]) * LR[j])); }
  ANG = clamp(ANG_CANDS.length ? Math.min.apply(null, ANG_CANDS) : 0.55, 0.02, 0.55);
  var GA=Math.PI*(3-Math.sqrt(5));
  var idx=0;
  for(j=0;j<L;j++){
    var cnt=counts[j]; if(cnt<=0) continue;
    var rr=LR[j];
    for(var i=0;i<cnt;i++){
      var y=1-(i+0.5)*2/cnt;
      var phi=Math.asin(clamp(y,-1,1));
      var theta=i*GA+j*1.234;
      var item=items[idx++];
      if (item._customTheta !== undefined && item._customPhi !== undefined) {
        theta = item._customTheta;
        phi = item._customPhi;
      }
      var dx=-Math.cos(phi)*Math.sin(theta);
      var dy=Math.sin(phi);
      var dz=-Math.cos(phi)*Math.cos(theta);
      allPhotos.push({
        url:item.url, urls:item.urls, link:item.link, btnText:item.btnText,
        caption:item.caption, price:item.price, isVideo:!!item.isVideo, _carIdx:0,
        dx:dx, dy:dy, dz:dz, theta:theta, phi:phi, r:rr,
        aspect: item.isVideo ? (16/9) : 1.5,
        _z2:0, _retries:0, _isCenter:false, _fallbackVideo:false });
      var pd = {
        url:item.url, urls:item.urls, link:item.link, btnText:item.btnText,
        caption:item.caption, price:item.price, isVideo:!!item.isVideo };
      if (item._customTheta !== undefined) pd._customTheta = item._customTheta;
      if (item._customPhi !== undefined) pd._customPhi = item._customPhi;
      photoData.push(pd);
    }
  }
  layout(); updatePool(); applyWorld(); updateAllCaptions();
}

function getNatural(slot){ return { w: slot.img.naturalWidth || slot.video.videoWidth || 0, h: slot.img.naturalHeight || slot.video.videoHeight || 0 }; }
function setSlotSize(slot, p){
  var base=R*p.r*ANG*cfg.density;
  var aspect=p.aspect||1.5;
  var w=base*Math.sqrt(aspect), h=base/Math.sqrt(aspect);
  var persp = P / (R * p.r);
  var nd = getNatural(slot);
  var useLod = p._isCenter && persp > 1.02 && nd.w > 0 && nd.h > 0;
  var layoutW, layoutH, scale;
  if(useLod){
    var geomW = w * persp, geomH = h * persp;
    var maxW = nd.w / DPR, maxH = nd.h / DPR;
    var D = Math.min(geomW, maxW, maxH * aspect);
    if(D < 4) D = Math.min(geomW, 4);
    layoutW = D; layoutH = D / aspect; scale = 1 / persp;
  } else { layoutW = w; layoutH = h; scale = 1; }
  slot.scale = scale;
  var cw = Math.round(layoutW*100)/100, ch = Math.round(layoutH*100)/100;
  if(slot._cw !== cw || slot._ch !== ch){
    slot._cw = cw; slot._ch = ch;
    slot.el.style.width = cw + 'px';
    slot.el.style.height = ch + 'px';
    slot.el.style.left = (-cw/2) + 'px';
    slot.el.style.top = (-ch/2) + 'px';
  }
  setSlotTransform(slot, p);
}
function setSlotTransform(slot, p){
  var s = slot.scale || 1;
  var str = 'rotateY('+(p.theta*R2D)+'deg) rotateX('+(p.phi*R2D)+'deg) translateZ('+(-(R*p.r))+'px)';
  if(Math.abs(s-1) > 0.001) str += ' scale(' + (Math.round(s*10000)/10000) + ')';
  slot.el.style.transform = str;
}
function layout(){
  var h=stage.clientHeight||window.innerHeight;
  var w=stage.clientWidth||window.innerWidth;
  R=clamp(Math.min(h,w*0.95)*0.86,300,1400);
  P=R*zoomFactor;
  stage.style.perspective=P+'px';
  for(var i=0;i<pool.length;i++) if(pool[i].currentPhoto && pool[i]!==focusedSlot) setSlotSize(pool[i],pool[i].currentPhoto);
  if(focused) applyFocusSize();
  applyWorld(); updateAllCaptions();
}
function applyWorld(){
  world.style.transform='translateZ('+P+'px) rotateX('+pitch+'deg) rotateY('+yaw+'deg)';

  if (cfg.showBillboard) {
    var bbCont = document.getElementById('billboardContainer');
    var billboardDist = R * 0.9;
    bbCont.style.transform = 'translateZ(' + (P - billboardDist) + 'px) rotateX(' + pitch + 'deg) rotateY(' + yaw + 'deg)';
  }

  drawPano();
}
function isPhotoCenter(p){
  var cyaw=Math.cos(yaw*D2R), syaw=Math.sin(yaw*D2R);
  var cpit=Math.cos(pitch*D2R), spit=Math.sin(pitch*D2R);
  var rr = R * p.r;
  var ct=Math.cos(p.theta), st=Math.sin(p.theta);
  var cph=Math.cos(p.phi), sph=Math.sin(p.phi);
  var y1 = rr*sph, z1 = -rr*cph;
  var x2 = -rr*cph*st, z2 = -rr*cph*ct;
  var x3 = x2*cyaw + z2*syaw, z3 = -x2*syaw + z2*cyaw;
  var y4 = y1*cpit - z3*spit, z4 = y1*spit + z3*cpit;
  var dist = -z4;
  if(dist < 30) return false;
  var f = P / dist;
  var vw = stage.clientWidth || window.innerWidth;
  var vh = stage.clientHeight || window.innerHeight;
  return Math.abs(x3*f) < vw*CENTER_FRAC && Math.abs(y4*f) < vh*CENTER_FRAC;
}

function assignSlot(slot, p){
  var changed = slot.currentPhoto !== p;
  slot.currentPhoto = p;
  if(changed){
    slot.el.classList.remove('focused','dim');
    showPhotoInSlot(slot,p);
    if(cfg.autoPool && !p.isVideo && p.urls && p.urls.length > 1) scheduleFirstSwap(slot);
    else slot.nextSwapAt = 0;
  }
  slot.el.classList.remove('hidden');
  setSlotSize(slot,p);
}
function updatePool(){
  if(focused) return;
  if(!allPhotos.length) return;
  var cp=Math.cos(pitch*D2R), sp=Math.sin(pitch*D2R), cy=Math.cos(yaw*D2R), sy=Math.sin(yaw*D2R);
  var candidates=[];
  for(var i=0;i<allPhotos.length;i++){
    var p=allPhotos[i];
    var z1=-p.dx*sy+p.dz*cy, z2=p.dy*sp+z1*cp;
    p._z2=z2;
    if(z2 < 0.15) candidates.push(p);
  }
  for(var i=0;i<candidates.length;i++) candidates[i]._isCenter = isPhotoCenter(candidates[i]);
  candidates.sort(function(a,b){ return a._z2 - b._z2; });
  var show = candidates.slice(0, POOL_SIZE);
  for(var i=0;i<pool.length;i++) pool[i]._used=false;
  var slotByUrl={};
  for(var i=0;i<pool.length;i++) if(pool[i].currentPhoto) slotByUrl[pool[i].currentPhoto.url]=pool[i];
  var needList=[];
  for(var i=0;i<show.length;i++){
    var p=show[i]; var slot=slotByUrl[p.url];
    if(slot && !slot._used){ slot._used=true; assignSlot(slot,p); }
    else needList.push(p);
  }
  var fi=0;
  for(var i=0;i<needList.length;i++){
    var slot=null;
    while(fi<pool.length){ if(!pool[fi]._used){ slot=pool[fi]; fi++; break; } fi++; }
    if(!slot) break;
    slot._used=true; assignSlot(slot, needList[i]);
  }
  for(var i=0;i<pool.length;i++){
    if(!pool[i]._used){
      if(pool[i].video && !pool[i].video.paused){ try{ pool[i].video.pause(); }catch(e){} }
      if(!pool[i].el.classList.contains('hidden')) pool[i].el.classList.add('hidden');
      pool[i].currentPhoto=null; pool[i]._cw=0; pool[i]._ch=0; pool[i].nextSwapAt=0;
      if(pool[i].capEl) pool[i].capEl.style.display='none';
    }
  }
  refreshVideoPlayback();
}

function updateLinkBtn(p){
  if(!linkBtn) return;
  if(p && cfg.enableLinks && p.link){
    var label = (p.btnText || 'Перейти по ссылке 🔗').replace(/\{caption\}/gi, p.caption || '').replace(/\{name\}/gi, p.caption || '');
    linkBtn.href = p.link; linkBtn.textContent = label; linkBtn.style.display = 'block';
    linkBtn.setAttribute('target','_blank'); linkBtn.setAttribute('rel','noopener');
  } else { linkBtn.style.display = 'none'; linkBtn.removeAttribute('href'); }
}

function showCarousel(){ if(carNav) carNav.classList.add('show'); if(carDots) carDots.classList.add('show'); }
function hideCarousel(){ if(carNav) carNav.classList.remove('show'); if(carDots) carDots.classList.remove('show'); }
function updateCarouselUI(){
  if(!focused || !focusedSlot || !cfg.enableCarousel || focused.isVideo || focused.urls.length<=1){
    hideCarousel(); stopCarouselTimer(); return;
  }
  showCarousel(); updateCarouselDots(); startCarouselTimer();
}
function updateCarouselDots(){
  if(!focused || !carDots) return;
  carDots.innerHTML = '';
  for(var i=0;i<focused.urls.length;i++){
    var dot = document.createElement('div');
    dot.className = 'car-dot' + (i === focused._carIdx ? ' active' : '');
    (function(idx){ dot.onclick = function(e){ e.stopPropagation(); focused._carIdx = idx; updateCarouselImage(); resetCarouselTimer(); }; })(i);
    carDots.appendChild(dot);
  }
}
function updateCarouselImage(){
  if(!focused || !focusedSlot) return;
  var u = focused.urls[focused._carIdx];
  if(focusedSlot.img.getAttribute('src') !== u) focusedSlot.img.src = u;
  focusedSlot.img.classList.add('img-visible');
  if(focusedSlot.img2) focusedSlot.img2.classList.remove('img-visible');
  updateCarouselDots(); lastInteract=performance.now();
}
function carNext(){ if(!focused || focused.urls.length<=1) return; focused._carIdx = (focused._carIdx + 1) % focused.urls.length; updateCarouselImage(); resetCarouselTimer(); }
function carPrev(){ if(!focused || focused.urls.length<=1) return; focused._carIdx = (focused._carIdx - 1 + focused.urls.length) % focused.urls.length; updateCarouselImage(); resetCarouselTimer(); }

function updateLogo(){

}

function focus(p){
  if(focused===p) return;
  if(focused) unfocus();
  var slot=null;
  for(var i=0;i<pool.length;i++){ if(pool[i].currentPhoto===p){ slot=pool[i]; break; } }
  if(!slot){ for(var i=0;i<pool.length;i++){ if(!pool[i].currentPhoto){ slot=pool[i]; break; } } }
  if(!slot){ slot=pool[0]; slot.currentPhoto=null; slot._cw=0; slot._ch=0; }
  if(!slot) return;
  focused=p; focusedSlot=slot;
  slot._swapToken = (slot._swapToken||0) + 1;
  if(slot.currentPhoto!==p){ slot.currentPhoto=p; showPhotoInSlot(slot,p); }
  else if(!p.isVideo && p.urls && p.urls.length>1){
    var curU = p.urls[p._carIdx||0];
    if(slot.img.getAttribute('src') !== curU) slot.img.src = curU;
    slot.img.classList.add('img-visible');
    if(slot.img2) slot.img2.classList.remove('img-visible');
  }
  slot.el.classList.remove('hidden');
  slot.el.classList.add('focused');
  for(var i=0;i<pool.length;i++){ if(pool[i]!==slot) pool[i].el.classList.add('dim'); }
  var ty=Math.atan2(p.dx,-p.dz)*R2D;
  tYaw=yaw+((((ty-yaw)%360)+540)%360)-180;
  tPitch=clamp(-p.phi*R2D,-85,85);
  applyFocusSize();
  lastInteract=performance.now();
  updateLinkBtn(p);
  updateCarouselUI();
  if(hint){
    var hasAction = (cfg.enableLinks && p.link);
    var hasCar = cfg.enableCarousel && !p.isVideo && p.urls.length>1;
    if(hasAction || hasCar){ hint.classList.remove('show'); }
    else { hint.textContent = p.isVideo ? '▶ Видео · клик в пустоту или Esc — назад' : 'Клик в пустоту или Esc — назад'; hint.classList.add('show'); }
  }
  if(p.isVideo && slot.video){
    slot.video.muted=false;
    var pr=slot.video.play();
    if(pr && pr.catch) pr.catch(function(){ slot.video.muted=true; var pr2=slot.video.play(); if(pr2 && pr2.catch) pr2.catch(function(){}); });
  }
  refreshVideoPlayback();
  updateSlotCaptionText(slot);
}
function applyFocusSize(){
  if(!focused || !focusedSlot) return;
  var p=focused;
  var vw=stage.clientWidth, vh=stage.clientHeight;
  var aspect=p.aspect||1.5;
  var target=Math.min(vw*0.86, vh*0.78*aspect);
  var nd = getNatural(focusedSlot);
  if(nd.w > 0 && nd.h > 0){
    var maxTarget = Math.min(nd.w/DPR, (nd.h/DPR)*aspect);
    if(target > maxTarget) target = maxTarget;
  }
  var w=target, h=target/aspect;
  var dist=R*p.r, scale=dist/P;
  focusedSlot.el.style.width=w+'px'; focusedSlot.el.style.height=h+'px';
  focusedSlot.el.style.left=(-w/2)+'px'; focusedSlot.el.style.top=(-h/2)+'px';
  focusedSlot.el.style.transform='rotateY('+(p.theta*R2D)+'deg) rotateX('+(p.phi*R2D)+'deg) translateZ('+(-(R*p.r))+'px) scale('+scale+')';
  focusedSlot.scale=scale; focusedSlot._cw=w; focusedSlot._ch=h;
}
function unfocus(){
  if(!focused) return;
  stopCarouselTimer();
  var p=focused, slot=focusedSlot;
  focused=null; focusedSlot=null;
  if(slot){
    slot.el.classList.remove('focused');
    if(p.isVideo && slot.video){ slot.video.muted=true; }
    slot.scale=1; slot._cw=0; slot._ch=0;
    if(!p.isVideo && p.urls && p.urls.length>1){
      var u = p.urls[p._carIdx||0];
      if(slot.img.getAttribute('src') !== u) slot.img.src = u;
    }
    slot.img.classList.add('img-visible');
    if(slot.img2) slot.img2.classList.remove('img-visible');
    setSlotSize(slot,p);
    if(slot.capEl) slot.capEl.classList.remove('focused');
    if(cfg.autoPool && !p.isVideo && p.urls && p.urls.length > 1) scheduleFirstSwap(slot);
  }
  for(var i=0;i<pool.length;i++) pool[i].el.classList.remove('dim');
  if(hint) hint.classList.remove('show');
  updateLinkBtn(null);
  hideCarousel();
  lastInteract=performance.now();
  updatePool(); updateAllCaptions();
}

function inQuad(q,x,y){
  var c=false;
  for(var i=0,j=3;i<4;j=i++){
    var xi=q[i][0],yi=q[i][1],xj=q[j][0],yj=q[j][1];
    if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
  }
  return c;
}
function pickPhoto(x,y){
  var rect=stage.getBoundingClientRect();
  var sx=x-rect.left-rect.width/2;
  var sy=y-rect.top-rect.height/2;
  var cyaw=Math.cos(yaw*D2R), syaw=Math.sin(yaw*D2R);
  var cpit=Math.cos(pitch*D2R), spit=Math.sin(pitch*D2R);
  var best=null, bestZ=1e9;
  for(var i=0;i<pool.length;i++){
    var slot=pool[i];
    if(slot.el.classList.contains('hidden')) continue;
    var p=slot.currentPhoto; if(!p) continue;
    var s=slot.scale||1;
    var hw=slot.el.offsetWidth*0.5*s, hh=slot.el.offsetHeight*0.5*s;
    var rr=R*p.r;
    var ct=Math.cos(p.theta), st=Math.sin(p.theta);
    var cph=Math.cos(p.phi), sph=Math.sin(p.phi);
    var cor=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];
    var q=[], zmin=1e9, ok=true;
    for(var k=0;k<4;k++){
      var cx=cor[k][0], cy=cor[k][1];
      var y1=cy*cph+rr*sph, z1=cy*sph-rr*cph, x1=cx;
      var x2=x1*ct+z1*st, z2=-x1*st+z1*ct;
      var X=x2*cyaw+z2*syaw, Z=-x2*syaw+z2*cyaw, Y=y1;
      var Y2=Y*cpit-Z*spit, Z2=Y*spit+Z*cpit;
      var Zf=Z2+P;
      if(Zf>=P*0.999){ ok=false; break; }
      var f=P/(P-Zf);
      q.push([X*f,Y2*f]);
      if(Zf<zmin) zmin=Zf;
    }
    if(!ok) continue;
    if(zmin<bestZ && inQuad(q,sx,sy)){ bestZ=zmin; best=p; }
  }
  return best;
}

function setBgColor(c){
  cfg.bgColor=c;

}

function updateBillboardMedia(container, url, isFlip) {
  container.innerHTML = '';
  if (!url) return;
  var isVideo = /\.(mp4|webm|ogg|mov)$/i.test(url) || /^data:video/i.test(url);
  var el;
  if (isVideo) {
    el = document.createElement('video');
    el.src = url;
    el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true;
    el.setAttribute('playsinline', '');
    el.setAttribute('disablepictureinpicture', '');
  } else {
    el = document.createElement('img');
    el.src = url;
    el.draggable = false;
  }
  el.style.width = '100%';
  el.style.height = '100%';
  el.style.objectFit = 'contain';
  el.style.transition = 'transform 0.3s';
  if (isFlip) el.style.transform = 'scaleX(-1)';
  else el.style.transform = 'none';
  container.appendChild(el);
}

function updateBillboard() {
  var bbCont = document.getElementById('billboardContainer');
  if (!cfg.showBillboard) { bbCont.style.display = 'none'; return; }
  bbCont.style.display = 'block';

  var bbFront = document.getElementById('bbFront');
  var bbBack = document.getElementById('bbBack');

  bbFront.style.transform = 'scale(' + cfg.bbScale + ') translate(-50%, -50%) translateZ(1px)';
  bbBack.style.transform  = 'rotateY(180deg) scale(' + cfg.bbScale + ') translate(-50%, -50%) translateZ(1px)';
  bbFront.style.background = 'transparent';
  bbBack.style.background = 'transparent';
  bbFront.style.boxShadow = 'none';
  bbBack.style.boxShadow = 'none';

  var hasF = cfg.bbEnableFrontLink && (cfg.bbFrontLink || cfg.bbLink);
  var hasB = cfg.bbEnableBackLink && (cfg.bbBackLink || cfg.bbLink);
  bbFront.style.cursor = hasF ? 'pointer' : 'default';
  bbBack.style.cursor  = hasB ? 'pointer' : 'default';
  bbFront.style.pointerEvents = hasF ? 'auto' : 'none';
  bbBack.style.pointerEvents  = hasB ? 'auto' : 'none';
}

var snowCanvas = document.getElementById('snowCanvas');
var snowCtx = snowCanvas.getContext('2d');
var effectParticles = { snow: [], rain: [], items: [], custom: [], center: [] };
var imageCache = {};

function preloadImages(urls, callback) {
  if (!urls || !urls.length) { if (callback) callback(); return; }
  var pending = urls.length;
  var done = function() { pending--; if (pending <= 0 && callback) callback(); };
  urls.forEach(function(url) {
    if (!url) { done(); return; }
    if (imageCache[url] && imageCache[url].complete) { done(); return; }
    var img = new Image();
    img.onload = done;
    img.onerror = done;
    img.src = url;
    imageCache[url] = img;
  });
}

function pickEmoji(list) {
  var items = String(list || '').split(',').map(function(s){return s.trim();}).filter(Boolean);
  if (!items.length) return '💰';
  return items[Math.floor(Math.random() * items.length)];
}
function pickImageIdx(arr) {
  if (!arr || !arr.length) return -1;
  return Math.floor(Math.random() * arr.length);
}

function createParticle(type, initial) {
  var eff = cfg.effects[type];
  var W = snowCanvas.width, H = snowCanvas.height;
  var sz1 = (eff.minSize !== undefined) ? eff.minSize : (cfg.snowMinSize || 1);
  var sz2 = (eff.maxSize !== undefined) ? eff.maxSize : (cfg.snowMaxSize || 8);
  if (sz2 < sz1) sz2 = sz1;
  var szr = sz1 + Math.random() * (sz2 - sz1);

  if (type === 'center') {
    var isToward = eff.direction === 'toward';
    var maxR = Math.hypot(W, H) / 2 + 50;
    return {
      angle: Math.random() * Math.PI * 2,
      radius: isToward ? (maxR * (0.6 + Math.random() * 0.4)) : (5 + Math.random() * 20),
      size: szr,
      baseRadialSpeed: 0.8 + Math.random() * 2.0,
      emoji: pickEmoji(eff.emojis || '✨'),
      imgIdx: pickImageIdx(eff.images || []),
      alpha: 1
    };
  }

  var isUp = (type === 'custom' && eff.direction === 'up');
  var p = {
    x: Math.random() * W,
    y: initial ? Math.random() * H : (isUp ? H + 40 : -40),
    baseVx: 0, baseVy: 0,
    size: 4, rotation: 0, rotationSpeed: 0,
    emoji: null, imgIdx: -1, alpha: 1
  };
  switch (type) {
    case 'snow':
      p.size = Math.max(1, szr);
      p.baseVy = 0.6 + Math.random() * 1.2;
      p.baseVx = (Math.random() - 0.5) * 0.8;
      break;
    case 'rain':
      p.size = Math.max(1, szr);
      p.baseVy = 7 + Math.random() * 8;
      p.baseVx = (Math.random() - 0.5) * 1.5;
      break;
    case 'items':
      p.size = Math.max(8, szr);
      p.baseVy = 0.9 + Math.random() * 2.4;
      p.baseVx = (Math.random() - 0.5) * 1.2;
      p.rotation = Math.random() * Math.PI * 2;
      p.rotationSpeed = (Math.random() - 0.5) * 0.05;
      p.emoji = pickEmoji(eff.emojis);
      break;
    case 'custom':
    default:
      p.size = Math.max(1, szr);
      var dir = isUp ? -1 : 1;
      p.baseVy = dir * (1.2 + Math.random() * 4);
      p.baseVx = (Math.random() - 0.5) * 2;
      break;
  }
  p.imgIdx = pickImageIdx(eff.images);
  return p;
}

function initEffect(type) {
  var eff = cfg.effects[type];
  effectParticles[type] = [];
  if (!eff.enabled) return;
  var cnt = Math.max(0, eff.count | 0);
  for (var i = 0; i < cnt; i++) effectParticles[type].push(createParticle(type, true));
}

function drawEffect(type) {
  var eff = cfg.effects[type];
  if (!eff.enabled) return;
  var particles = effectParticles[type];
  if (!particles.length) return;
  var images = eff.images || [];
  var isUp = (type === 'custom' && eff.direction === 'up');
  var W = snowCanvas.width, H = snowCanvas.height;
  var speedMul = (eff.speed !== undefined) ? Math.max(0, eff.speed) : Math.max(0, cfg.snowSpeed || 1);

  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var vx = p.baseVx * speedMul;
    var vy = p.baseVy * speedMul;
    p.x += vx;
    p.y += vy;
    if (type === 'items') p.rotation += p.rotationSpeed * Math.max(0.3, Math.min(3, speedMul));

    var sz = p.size;
    if (isUp) {
      if (p.y < -sz - 30) { p.y = H + sz + 20; p.x = Math.random() * W; if (type === 'items') p.emoji = pickEmoji(eff.emojis); p.imgIdx = pickImageIdx(images); }
    } else {
      if (p.y > H + sz + 30) { p.y = -sz - 20; p.x = Math.random() * W; if (type === 'items') p.emoji = pickEmoji(eff.emojis); p.imgIdx = pickImageIdx(images); }
    }
    if (p.x > W + sz + 30) p.x = -sz - 20;
    if (p.x < -sz - 30) p.x = W + sz + 20;

    var imgUrl = (p.imgIdx >= 0 && images[p.imgIdx]) ? images[p.imgIdx] : null;
    var img = imgUrl ? imageCache[imgUrl] : null;

    if (img && img.complete && img.naturalWidth > 0) {
      snowCtx.save();
      snowCtx.translate(p.x, p.y);
      if (p.rotation) snowCtx.rotate(p.rotation);
      snowCtx.globalAlpha = p.alpha;
      snowCtx.drawImage(img, -sz/2, -sz/2, sz, sz);
      snowCtx.restore();
    } else {
      if (type === 'snow') {
        snowCtx.fillStyle = 'rgba(255,255,255,0.9)';
        snowCtx.beginPath(); snowCtx.arc(p.x, p.y, Math.max(1, sz/2), 0, Math.PI * 2); snowCtx.fill();
      } else if (type === 'rain') {
        var streak = Math.max(8, p.baseVy * speedMul * 1.4);
        snowCtx.strokeStyle = 'rgba(170,210,255,0.6)';
        snowCtx.lineWidth = Math.max(0.8, p.size);
        snowCtx.lineCap = 'round';
        snowCtx.beginPath(); snowCtx.moveTo(p.x, p.y); snowCtx.lineTo(p.x + vx * 2, p.y - streak); snowCtx.stroke();
      } else if (type === 'items') {
        snowCtx.save(); snowCtx.translate(p.x, p.y); snowCtx.rotate(p.rotation);
        snowCtx.font = p.size + 'px serif';
        snowCtx.textAlign = 'center'; snowCtx.textBaseline = 'middle';
        snowCtx.fillText(p.emoji || '💰', 0, 0);
        snowCtx.restore();
      } else if (type === 'custom') {
        snowCtx.fillStyle = 'rgba(255,255,255,0.85)';
        snowCtx.beginPath(); snowCtx.arc(p.x, p.y, Math.max(1, sz/2), 0, Math.PI * 2); snowCtx.fill();
      }
    }
  }
}

/* ============================================================
   ЭФФЕКТ "К ЦЕНТРУ / ОТ ЦЕНТРА"
   ============================================================ */
function drawCenterEffect() {
  var eff = cfg.effects.center;
  if (!eff || !eff.enabled) return;
  var particles = effectParticles.center;
  if (!particles.length) return;
  var images = eff.images || [];
  var isToward = eff.direction === 'toward';
  var W = snowCanvas.width, H = snowCanvas.height;
  var cx = W / 2, cy = H / 2;
  var maxR = Math.hypot(W, H) / 2 + 50;
  var speedMul = (eff.speed !== undefined) ? Math.max(0, eff.speed) : 1;

  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var radialV = p.baseRadialSpeed * speedMul;

    if (isToward) p.radius -= radialV;
    else p.radius += radialV;

    // Respawn
    if (isToward && p.radius < 3) {
      p.radius = maxR * (0.85 + Math.random() * 0.15);
      p.angle = Math.random() * Math.PI * 2;
      p.baseRadialSpeed = 0.8 + Math.random() * 2.0;
      p.emoji = pickEmoji(eff.emojis || '✨');
      p.imgIdx = pickImageIdx(images);
    } else if (!isToward && p.radius > maxR) {
      p.radius = 3 + Math.random() * 15;
      p.angle = Math.random() * Math.PI * 2;
      p.baseRadialSpeed = 0.8 + Math.random() * 2.0;
      p.emoji = pickEmoji(eff.emojis || '✨');
      p.imgIdx = pickImageIdx(images);
    }

    var x = cx + Math.cos(p.angle) * p.radius;
    var y = cy + Math.sin(p.angle) * p.radius;
    var rot = isToward ? (p.angle + Math.PI) : p.angle;
    var sz = p.size;

    // Пропускаем далеко за пределами экрана
    if (x < -sz - 100 || x > W + sz + 100 || y < -sz - 100 || y > H + sz + 100) continue;

    var imgUrl = (p.imgIdx >= 0 && images[p.imgIdx]) ? images[p.imgIdx] : null;
    var img = imgUrl ? imageCache[imgUrl] : null;

    if (img && img.complete && img.naturalWidth > 0) {
      snowCtx.save();
      snowCtx.translate(x, y);
      snowCtx.rotate(rot);
      snowCtx.drawImage(img, -sz/2, -sz/2, sz, sz);
      snowCtx.restore();
    } else {
      snowCtx.save();
      snowCtx.translate(x, y);
      snowCtx.rotate(rot);
      snowCtx.font = sz + 'px serif';
      snowCtx.textAlign = 'center';
      snowCtx.textBaseline = 'middle';
      snowCtx.fillText(p.emoji || '✨', 0, 0);
      snowCtx.restore();
    }
  }
}

function drawSnow() {
  snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
  drawEffect('snow'); drawEffect('rain'); drawEffect('items'); drawEffect('custom');
  drawCenterEffect();
}
function anyEffectEnabled() {
  var e = cfg.effects;
  return e.snow.enabled || e.rain.enabled || e.items.enabled || e.custom.enabled ||
         (e.center && e.center.enabled);
}
function initAllEffects() {
  snowCanvas.width = window.innerWidth;
  snowCanvas.height = window.innerHeight;
  initEffect('snow'); initEffect('rain'); initEffect('items'); initEffect('custom'); initEffect('center');
}

/* ============================================================
   МИГРАЦИЯ / ДЕФОЛТЫ ЭФФЕКТОВ
   ============================================================ */
function ensureEffectDefaults() {
  if (!cfg.effects) cfg.effects = {};
  var gSpeed = (typeof cfg.snowSpeed === 'number' && isFinite(cfg.snowSpeed) && cfg.snowSpeed > 0) ? cfg.snowSpeed : 1;
  var defaults = {
    snow:   { enabled:false, count:150, images:[], speed:gSpeed, minSize:2, maxSize:12 },
    rain:   { enabled:false, count:200, images:[], speed:gSpeed, minSize:1, maxSize:4 },
    items:  { enabled:false, count:50,  images:[], emojis:'💰,💵,🍬,🎁,🐘,🌸,⭐,🍀', speed:gSpeed, minSize:12, maxSize:48 },
    custom: { enabled:false, count:100, images:[], direction:'down', speed:gSpeed, minSize:2, maxSize:12 },
    center: { enabled:false, count:80,  images:[], emojis:'✨,⭐,🌟,💫', direction:'toward', speed:gSpeed*1.5, minSize:8, maxSize:24 }
  };
  for (var k in defaults) {
    if (!cfg.effects[k]) cfg.effects[k] = {};
    var d = defaults[k];
    for (var f in d) {
      if (cfg.effects[k][f] === undefined) cfg.effects[k][f] = d[f];
    }
  }
}

/* ============================================================
   ЭКСПОРТ ПАНОРАМЫ
   ============================================================ */

function sleepExport(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function loadImageCORS(url){
  return new Promise(function(resolve){
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){ resolve(img); };
    img.onerror = function(){
      var img2 = new Image();
      img2.onload = function(){ resolve(img2); };
      img2.onerror = function(){ resolve(null); };
      img2.src = url;
    };
    img.src = url;
  });
}

async function loadPanoBackgroundData(url, filter){
  var img = await loadImageCORS(url);
  if(!img) return null;
  var w = img.naturalWidth || img.width;
  var h = img.naturalHeight || img.height;
  if(!w || !h) return null;
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d');
  if(filter && typeof ctx.filter !== 'undefined') ctx.filter = filter;
  try { ctx.drawImage(img, 0, 0); return ctx.getImageData(0, 0, w, h); }
  catch(e){ console.warn('[Export] CORS панорамы:', url); return null; }
}

async function loadPhotoDataRounded(url, rLayer, radiusPx){
  var img = await loadImageCORS(url);
  if(!img) return null;
  var w = img.naturalWidth || img.width;
  var h = img.naturalHeight || img.height;
  if(!w || !h) return null;

  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d');

  if(radiusPx > 0){
    var aspectEst = Math.max(0.5, Math.min(2.0, w / h));
    var normW = rLayer * ANG * (cfg.density || 0.6) * Math.sqrt(aspectEst);
    var displayW = Math.max(80, 700 * normW * 2.0 * 1.3);
    var radiusFraction = Math.min(0.45, radiusPx / displayW);
    var rad = Math.min(w, h) * radiusFraction;
    rad = Math.min(rad, w / 2, h / 2);

    if(rad >= 0.5){
      ctx.beginPath();
      ctx.moveTo(rad, 0);
      ctx.lineTo(w - rad, 0);
      ctx.arc(w - rad, rad, rad, -Math.PI/2, 0);
      ctx.lineTo(w, h - rad);
      ctx.arc(w - rad, h - rad, rad, 0, Math.PI/2);
      ctx.lineTo(rad, h);
      ctx.arc(rad, h - rad, rad, Math.PI/2, Math.PI);
      ctx.lineTo(0, rad);
      ctx.arc(rad, rad, rad, Math.PI, Math.PI*1.5);
      ctx.closePath();
      ctx.clip();
    }
  }

  try {
    ctx.drawImage(img, 0, 0, w, h);
    return ctx.getImageData(0, 0, w, h);
  } catch(e){
    console.warn('[Export] CORS фото:', url);
    return null;
  }
}

async function allocateExportBuffers(desiredW, desiredH, box){
  var candidates = [desiredW, 12000, 10000, 8192, 6144, 4096, 2048];
  for(var i = 0; i < candidates.length; i++){
    var tryW = candidates[i];
    if(tryW > desiredW) continue;
    var tryH = Math.round(tryW / 2);
    try {
      if(box) box.innerHTML = '💾 Выделение памяти (' + tryW + '×' + tryH + ')…';
      await sleepExport(30);
      var cv = document.createElement('canvas');
      cv.width = tryW; cv.height = tryH;
      var ctx = cv.getContext('2d');
      if(!ctx) throw new Error('no 2d ctx');
      var imgData = ctx.createImageData(tryW, tryH);
      if(!imgData || !imgData.data || imgData.data.length !== tryW * tryH * 4) throw new Error('bad imgData');
      var depth = new Uint16Array(tryW * tryH);
      depth.fill(65535);
      return { width: tryW, height: tryH, canvas: cv, ctx: ctx, imgData: imgData, depth: depth };
    } catch(e){
      console.warn('[Export] alloc fail at', tryW + 'x' + tryH, e.message);
      if(box) box.innerHTML = '⚠ Мало памяти для ' + tryW + '×' + tryH + '…<small>пробуем меньше</small>';
      await sleepExport(200);
    }
  }
  throw new Error('Не хватает памяти даже для 2048×1024. Закройте лишние вкладки и повторите.');
}

async function savePanorama(desiredW, desiredH, fmt, includePhotos){
  if(!cfg.bgUrl && !includePhotos){
    alert('Сначала загрузите панораму (URL или с ПК)');
    return;
  }

  var indicator = document.getElementById('saveOverlay');
  var box = document.getElementById('saveOverlayBox');
  box.innerHTML = '💾 Подготовка…<small>' + desiredW + '×' + desiredH + ' · ' + (fmt === 'png' ? 'PNG' : 'JPG') + '</small>';
  indicator.classList.add('show');

  try {
    var alloc = await allocateExportBuffers(desiredW, desiredH, box);
    var W = alloc.width, H = alloc.height;
    var out = alloc.imgData.data;
    var depth = alloc.depth;

    var bg = hexToRgb(cfg.bgColor);
    for(var i = 0; i < out.length; i += 4){
      out[i] = bg[0]; out[i+1] = bg[1]; out[i+2] = bg[2]; out[i+3] = 255;
    }

    var pitchR = pitch * Math.PI / 180, yawR = yaw * Math.PI / 180;
    var cp = Math.cos(pitchR), sp = Math.sin(pitchR);
    var cy = Math.cos(yawR), sy = Math.sin(yawR);
    var fwd = [sy*cp, -sp, -cy*cp];
    var up  = [-sy*sp, -cp, cy*sp];
    var rgt = [cy, 0, sy];
    var sinA = new Float32Array(W), cosA = new Float32Array(W);
    for(var x = 0; x < W; x++){
      var a = ((x + 0.5) / W - 0.5) * 2 * Math.PI;
      sinA[x] = Math.sin(a); cosA[x] = Math.cos(a);
    }
    var sinB = new Float32Array(H), cosB = new Float32Array(H);
    for(var y = 0; y < H; y++){
      var b = (0.5 - (y + 0.5) / H) * Math.PI;
      sinB[y] = Math.sin(b); cosB[y] = Math.cos(b);
    }

    if(cfg.bgUrl){
      box.innerHTML = '💾 Загрузка панорамы…<small>' + W + '×' + H + '</small>';
      await sleepExport(20);
      try {
        var filterStr = null;
        if(cfg.panoBlur > 0){
          var bp = cfg.panoBlur * 1.8;
          filterStr = 'blur(' + bp.toFixed(2) + 'px) saturate(' + (1 - cfg.panoBlur*0.03).toFixed(2) + ') brightness(' + (1 - cfg.panoBlur*0.02).toFixed(2) + ')';
        }
        var panoData = await loadPanoBackgroundData(cfg.bgUrl, filterStr);
        if(panoData){
          var pw = panoData.width, ph = panoData.height, pd = panoData.data;
          var lastPct = -1;
          for(var py = 0; py < H; py++){
            var sb0 = sinB[py], cb0 = cosB[py], rowOff = py * W * 4;
            for(var px = 0; px < W; px++){
              var sa0 = sinA[px], ca0 = cosA[px];
              var wx = cb0*sa0*rgt[0] + sb0*up[0] + cb0*ca0*fwd[0];
              var wy = cb0*sa0*rgt[1] + sb0*up[1] + cb0*ca0*fwd[1];
              var wz = cb0*sa0*rgt[2] + sb0*up[2] + cb0*ca0*fwd[2];
              var phi = Math.asin(wy > 1 ? 1 : (wy < -1 ? -1 : wy));
              var v = 0.5 - phi / Math.PI;
              var theta = Math.atan2(wx, -wz); if(theta < 0) theta += 2 * Math.PI;
              var u = theta / (2 * Math.PI);
              if(cfg.panoFlipX) u = 1 - u;
              var ix = Math.floor(u * pw); if(ix >= pw) ix = pw - 1; if(ix < 0) ix = 0;
              var iy = Math.floor(v * ph); if(iy >= ph) iy = ph - 1; if(iy < 0) iy = 0;
              var pi4 = (iy * pw + ix) * 4, oi4 = rowOff + px * 4;
              out[oi4] = pd[pi4]; out[oi4+1] = pd[pi4+1]; out[oi4+2] = pd[pi4+2]; out[oi4+3] = 255;
            }
            if((py & 255) === 0){
              var pct = Math.floor(py / H * 100);
              if(pct !== lastPct){
                lastPct = pct;
                box.innerHTML = '💾 Панорама ' + pct + '%<small>' + W + '×' + H + '</small>';
                await sleepExport(0);
              }
            }
          }
        } else {
          console.warn('[Export] Панорама не загружена (CORS) — фон залит цветом');
        }
      } catch(e){ console.warn('[Export] ошибка панорамы:', e); }
    }

    if(includePhotos && allPhotos.length){
      var DEPTH_SCALE = 16, DEPTH_INF = 65535;
      var total = allPhotos.length, rendered = 0;
      var radiusForExport = cfg.radius || 0;
      for(var pi = 0; pi < total; pi++){
        var p = allPhotos[pi];
        var curUrl = (p.urls && p.urls[p._carIdx || 0]) || p.url;
        if(!curUrl) continue;
        box.innerHTML = '💾 Фото ' + (pi + 1) + '/' + total + '…<small>' + W + '×' + H + (radiusForExport > 0 ? ' · скругление' : '') + '</small>';
        await sleepExport(0);
        try {
          var src = await loadPhotoDataRounded(curUrl, p.r, radiusForExport);
          if(!src){ console.warn('[Export] фото пропущено:', curUrl.slice(0, 60)); continue; }
          rendered++;
          var aspect = Math.max(0.5, Math.min(2.0, src.width / src.height));
          var theta = p.theta, phi0 = p.phi;
          var st = Math.sin(theta), ct = Math.cos(theta);
          var sphi = Math.sin(phi0), cphi = Math.cos(phi0);
          var U = [ct, 0, -st], V = [st*sphi, cphi, ct*sphi], N = [cphi*st, -sphi, cphi*ct];
          var d = R * p.r;
          var base = R * p.r * ANG * cfg.density;
          var photoW = base * Math.sqrt(aspect), photoH = base / Math.sqrt(aspect);
          var halfW = photoW / 2, halfH = photoH / 2;
          var cD = [-N[0], -N[1], -N[2]];
          var cr = cD[0]*rgt[0] + cD[1]*rgt[1] + cD[2]*rgt[2];
          var cu = cD[0]*up[0] + cD[1]*up[1] + cD[2]*up[2];
          var cf = cD[0]*fwd[0] + cD[1]*fwd[1] + cD[2]*fwd[2];
          var alpha0 = Math.atan2(cr, cf);
          var beta0 = Math.asin(cu > 1 ? 1 : (cu < -1 ? -1 : cu));
          var halfDiag = Math.sqrt(halfW*halfW + halfH*halfH);
          var angExt = Math.atan2(halfDiag, Math.max(1, d - halfDiag));
          var dA = angExt * 1.45, dB = angExt * 1.45;
          var uC = (alpha0 / (2 * Math.PI) + 0.5) * W;
          var vC = (0.5 - beta0 / Math.PI) * H;
          var uR = dA / (2 * Math.PI) * W;
          var vR = dB / Math.PI * H;
          var nearSeam = Math.abs(alpha0) + dA > Math.PI;
          var uMin, uMax;
          if(nearSeam){ uMin = 0; uMax = W - 1; }
          else { uMin = Math.max(0, Math.floor(uC - uR)); uMax = Math.min(W - 1, Math.ceil(uC + uR)); }
          var vMin = Math.max(0, Math.floor(vC - vR));
          var vMax = Math.min(H - 1, Math.ceil(vC + vR));
          var iw = src.width, ih = src.height, sd = src.data;
          var imgAspect = iw / ih;
          var cropU = 0, cropV = 0, scaleU = 1, scaleV = 1;
          if(imgAspect > aspect){ cropU = (1 - aspect / imgAspect) / 2; scaleU = aspect / imgAspect; }
          else { cropV = (1 - imgAspect / aspect) / 2; scaleV = imgAspect / aspect; }
          for(var py2 = vMin; py2 <= vMax; py2++){
            var sb1 = sinB[py2], cb1 = cosB[py2], rowBase = py2 * W;
            for(var px2 = uMin; px2 <= uMax; px2++){
              var sa1 = sinA[px2], ca1 = cosA[px2];
              var wx2 = cb1*sa1*rgt[0] + sb1*up[0] + cb1*ca1*fwd[0];
              var wy2 = cb1*sa1*rgt[1] + sb1*up[1] + cb1*ca1*fwd[1];
              var wz2 = cb1*sa1*rgt[2] + sb1*up[2] + cb1*ca1*fwd[2];
              var denom = N[0]*wx2 + N[1]*wy2 + N[2]*wz2;
              if(denom >= -1e-6) continue;
              var t = -d / denom; if(t <= 0) continue;
              var Px = t*wx2, Py = t*wy2, Pz = t*wz2;
              var lx = Px*U[0] + Py*U[1] + Pz*U[2];
              var ly = Px*V[0] + Py*V[1] + Pz*V[2];
              if(lx < -halfW || lx > halfW) continue;
              if(ly < -halfH || ly > halfH) continue;
              var pixIdx = rowBase + px2;
              var tScaled = t * DEPTH_SCALE;
              if(tScaled >= depth[pixIdx]) continue;
              var un = lx / photoW + 0.5, vn = ly / photoH + 0.5;
              var iu, iv;
              if(imgAspect > aspect){ iu = cropU + un * scaleU; iv = vn; }
              else { iu = un; iv = cropV + vn * scaleV; }
              var ixp = Math.floor(iu * iw); if(ixp < 0) ixp = 0; if(ixp >= iw) ixp = iw - 1;
              var iyp = Math.floor(iv * ih); if(iyp < 0) iyp = 0; if(iyp >= ih) iyp = ih - 1;
              var si = (iyp * iw + ixp) * 4;
              var aa = sd[si+3]; if(aa === 0) continue;
              var oi = pixIdx * 4;
              if(aa === 255){
                out[oi] = sd[si]; out[oi+1] = sd[si+1]; out[oi+2] = sd[si+2]; out[oi+3] = 255;
              } else {
                var af = aa / 255, inf = 1 - af;
                out[oi] = out[oi]*inf + sd[si]*af;
                out[oi+1] = out[oi+1]*inf + sd[si+1]*af;
                out[oi+2] = out[oi+2]*inf + sd[si+2]*af;
                out[oi+3] = 255;
              }
              depth[pixIdx] = tScaled < DEPTH_INF ? (tScaled | 0) : DEPTH_INF - 1;
            }
          }
        } catch(e){ console.warn('[Export] ошибка фото:', e); }
      }
      if(rendered === 0 && !cfg.bgUrl){
        throw new Error('Не удалось загрузить ни панораму, ни фото (CORS?)');
      }
    }

    depth = null; alloc.depth = null;

    box.innerHTML = '💾 Финализация…<small>' + W + '×' + H + '</small>';
    await sleepExport(30);

    try { alloc.ctx.putImageData(alloc.imgData, 0, 0); }
    catch(e){ throw new Error('putImageData: ' + e.message); }

    await new Promise(function(resolve, reject){
      try {
        alloc.canvas.toBlob(function(blob){
          if(!blob){
            reject(new Error('Не удалось создать файл (возможно, не хватило памяти). Попробуйте меньшее разрешение.'));
            return;
          }
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'panorama-360-' + W + 'x' + H + '.' + (fmt === 'png' ? 'png' : 'jpg');
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
          resolve();
        }, fmt === 'png' ? 'image/png' : 'image/jpeg', 0.92);
      } catch(e){ reject(new Error('toBlob: ' + e.message)); }
    });

    box.innerHTML = '✅ Готово!<small>' + W + '×' + H + ' · ' + (fmt === 'png' ? 'PNG' : 'JPG') + '</small>';
    setTimeout(function(){ indicator.classList.remove('show'); }, 800);
  } catch(err) {
    console.error('[Export] error:', err);
    alert('Ошибка сохранения: ' + err.message);
    indicator.classList.remove('show');
  }
}

function saveProject() {
  var projectCfg = {};
  for (var k in cfg) {
    if (!cfg.hasOwnProperty(k)) continue;
    if (k === 'saveView') continue;
    projectCfg[k] = cfg[k];
  }
  var project = {
    format: 'sphere360-project',
    version: 3,
    savedAt: new Date().toISOString(),
    cfg: projectCfg,
    photos: photoData
  };
  var json = JSON.stringify(project, null, 2);
  var blob = new Blob([json], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g, '-');
  a.href = url;
  a.download = 'sphere-project-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
}

function loadProject(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var project = JSON.parse(e.target.result);
      if (!project || !project.cfg) throw new Error('Неверный формат проекта');
      var newCfg = project.cfg;
      for (var k in newCfg) {
        if (!newCfg.hasOwnProperty(k)) continue;
        if (k === 'effects' && newCfg.effects) {
          if (!cfg.effects) cfg.effects = {};
          for (var ek in newCfg.effects) {
            if (!cfg.effects[ek]) cfg.effects[ek] = {};
            for (var fk in newCfg.effects[ek]) cfg.effects[ek][fk] = newCfg.effects[ek][fk];
          }
        } else {
          cfg[k] = newCfg[k];
        }
      }
      ensureEffectDefaults();
      var photos = project.photos || [];
      var allEffectImages = [];
      ['snow','rain','items','custom','center'].forEach(function(t){
        if (cfg.effects[t] && cfg.effects[t].images) allEffectImages = allEffectImages.concat(cfg.effects[t].images);
      });
      preloadImages(allEffectImages, function(){
        initAllEffects();
      });
      build(photos, true);
      syncUIFromCfg();
      if (cfg.bgUrl) setPano(cfg.bgUrl, true);
      applyPhotoShadowsClass();
      alert('✅ Проект загружен: ' + photos.length + ' фото');
    } catch (err) {
      console.error(err);
      alert('Ошибка загрузки проекта: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function loop(){
  requestAnimationFrame(loop);
  var now=performance.now();
  var dt=Math.min(64,now-lastFrame); lastFrame=now;
  var changed=false;
  if(cfg.speed>0 && !dragging && !focused && now-lastInteract>2000){ tYaw+=cfg.speed*dt/16.67; changed=true; }
  var kk=1-Math.exp(-dt/90);
  if(Math.abs(tYaw-yaw)>0.002){ yaw+=(tYaw-yaw)*kk; changed=true; }
  else if(yaw!==tYaw){ yaw=tYaw; changed=true; }
  if(Math.abs(tPitch-pitch)>0.002){ pitch+=(tPitch-pitch)*kk; changed=true; }
  else if(pitch!==tPitch){ pitch=tPitch; changed=true; }
  if(changed){
    applyWorld();
    if(now-lastPoolUpdate>80){ lastPoolUpdate=now; updatePool(); }
    for(var i=0;i<pool.length;i++) updateCaptionPosition(pool[i]);
  }
  tickPoolSwaps(now);
  if (anyEffectEnabled()) drawSnow();
  else if (snowCtx) snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
}

stage.addEventListener('pointerdown',function(e){
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    lastInteract=performance.now();
    stopCarouselTimer();
    moved=0; lastX=e.clientX; lastY=e.clientY;
    if (cfg.photoDrag && !focused) {
      var hit = pickPhoto(e.clientX, e.clientY);
      if (hit) {
        dragPhoto = hit;
        dragPhotoStartTheta = hit.theta;
        dragPhotoStartPhi = hit.phi;
        dragPhotoStartX = e.clientX;
        dragPhotoStartY = e.clientY;
        dragPhotoMoved = false;
        dragging = true;
        stage.classList.add('dragging');
        for (var hi = 0; hi < pool.length; hi++) {
          if (pool[hi].currentPhoto === hit) { pool[hi].el.classList.add('dragging-photo'); break; }
        }
        return;
      }
    }
    dragging=true; swipeMode=false; swipeDX=0;
    stage.classList.add('dragging');
  } else if(pointers.size===2){ pinchDist=pd(); }
});
function pd(){ var a=Array.from(pointers.values()); return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); }
window.addEventListener('pointermove',function(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    var d=pd(); if(pinchDist) setP(P+(d-pinchDist)*1.2); pinchDist=d; return;
  }
  if(!dragging) return;
  if (dragPhoto) {
    var ddx = e.clientX - dragPhotoStartX;
    var ddy = e.clientY - dragPhotoStartY;
    if (Math.abs(ddx) > 3 || Math.abs(ddy) > 3) dragPhotoMoved = true;
    if (dragPhotoMoved) {
      var k = 1.5 / P;
      var dirX = cfg.dragInvertX ? 1 : -1;
      var dirY = cfg.dragInvertY ? -1 : 1;
      var newTheta = dragPhotoStartTheta + ddx * k * dirX;
      var newPhi   = dragPhotoStartPhi   + ddy * k * dirY;
      newPhi = clamp(newPhi, -Math.PI/2 + 0.02, Math.PI/2 - 0.02);
      dragPhoto.theta = newTheta;
      dragPhoto.phi = newPhi;
      dragPhoto.dx = -Math.cos(newPhi) * Math.sin(newTheta);
      dragPhoto.dy =  Math.sin(newPhi);
      dragPhoto.dz = -Math.cos(newPhi) * Math.cos(newTheta);
      for (var di = 0; di < photoData.length; di++) {
        if (photoData[di].url === dragPhoto.url) {
          photoData[di]._customTheta = newTheta;
          photoData[di]._customPhi = newPhi;
          break;
        }
      }
      updatePool(); updateAllCaptions();
      lastInteract = performance.now();
    }
    return;
  }
  var dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  if(focused && cfg.enableCarousel && !focused.isVideo && focused.urls.length>1){
    if(!swipeMode && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 3){ swipeMode=true; swipeDX=0; }
    if(swipeMode){ swipeDX += dx; return; }
  }
  moved+=Math.abs(dx)+Math.abs(dy);
  if(focused && moved>8) unfocus();
  tYaw-=dx*0.14;
  tPitch=clamp(tPitch+dy*0.14,-85,85);
  yaw=tYaw; pitch=tPitch;
  lastInteract=performance.now();
  applyWorld();
  if(performance.now()-lastPoolUpdate>80){ lastPoolUpdate=performance.now(); updatePool(); }
  for(var i=0;i<pool.length;i++) updateCaptionPosition(pool[i]);
});
window.addEventListener('pointerup',function(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchDist=0;
  if(pointers.size===0){
    stage.classList.remove('dragging');
    if (dragPhoto) {
      for (var ri = 0; ri < pool.length; ri++) pool[ri].el.classList.remove('dragging-photo');
      if (!dragPhotoMoved) { if (focused === dragPhoto) unfocus(); else focus(dragPhoto); }
      dragPhoto = null; dragging = false; swipeMode = false; return;
    }
    if(swipeMode){
      if(swipeDX > 40) carPrev(); else if(swipeDX < -40) carNext();
      swipeMode=false; swipeDX=0; dragging=false;
      if(focused) resetCarouselTimer();
      return;
    }
    var onLink = linkBtn && e.target && (e.target === linkBtn || linkBtn.contains(e.target));
    if(!onLink && dragging && moved<8){
      var isBBFront = e.target && e.target.closest('#bbFront');
      var isBBBack  = e.target && e.target.closest('#bbBack');
      var hasFrontLink = isBBFront && cfg.bbEnableFrontLink && (cfg.bbFrontLink || cfg.bbLink);
      var hasBackLink  = isBBBack && cfg.bbEnableBackLink && (cfg.bbBackLink || cfg.bbLink);
      if (hasFrontLink) window.open(cfg.bbFrontLink || cfg.bbLink, '_blank', 'noopener');
      else if (hasBackLink) window.open(cfg.bbBackLink || cfg.bbLink, '_blank', 'noopener');
      else {
        var p=pickPhoto(e.clientX,e.clientY);
        if(p){ if(focused===p) unfocus(); else focus(p); }
        else if(focused) unfocus();
      }
    }
    dragging=false;
  }
});
window.addEventListener('pointercancel',function(e){
  pointers.delete(e.pointerId);
  if(pointers.size===0){
    dragging=false; swipeMode=false; swipeDX=0;
    dragPhoto=null; dragPhotoMoved=false;
    stage.classList.remove('dragging');
    for (var ri = 0; ri < pool.length; ri++) pool[ri].el.classList.remove('dragging-photo');
  }
});

function parse(t){
  t=(t||'').trim(); if(!t) return [];
  if(t.charAt(0)==='['){
    try{
      var a=JSON.parse(t);
      if(Array.isArray(a)){
        return a.map(function(item){
          if(typeof item === 'string') return parseLine(item);
          if(item && (item.url || item.urls)){
            return { urls: item.urls || [item.url], url: item.url || (item.urls && item.urls[0]) || '',
              link: item.link || '', btnText: item.btnText || '',
              caption: item.caption || '', price: item.price || '', isVideo: !!item.isVideo,
              _customTheta: item._customTheta, _customPhi: item._customPhi };
          }
          return null;
        }).filter(Boolean);
      }
    }catch(err){}
  }
  return t.split(/\n/).map(parseLine).filter(Boolean);
}

function updateEffectInfo(type) {

}

function readFilesAsDataURLs(files, callback) {
  var results = [];
  var pending = files.length;
  if (pending === 0) { callback(results); return; }
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) { results.push(e.target.result); pending--; if (pending === 0) callback(results); };
    reader.onerror = function() { pending--; if (pending === 0) callback(results); };
    reader.readAsDataURL(file);
  });
}

function handleEffectImages(type, files) {
  var arr = Array.prototype.slice.call(files || []);
  if (!arr.length) return;
  readFilesAsDataURLs(arr, function(urls) {
    var eff = cfg.effects[type];
    eff.images = eff.images.concat(urls);
    if (eff.images.length > 20) eff.images = eff.images.slice(-20);
    preloadImages(eff.images, function() { initEffect(type); updateEffectInfo(type); });
  });
}

function bindEffect(type) {
  var capType = type.charAt(0).toUpperCase() + type.slice(1);
  var chk = document.getElementById('eff' + capType);
  var cnt = document.getElementById('eff' + capType + 'Count');
  var cntVal = document.getElementById('eff' + capType + 'CountVal');
  var spdI = document.getElementById('eff' + capType + 'Speed');
  var spdV = document.getElementById('eff' + capType + 'SpeedVal');
  var minI = document.getElementById('eff' + capType + 'MinSize');
  var minV = document.getElementById('eff' + capType + 'MinSizeVal');
  var maxI = document.getElementById('eff' + capType + 'MaxSize');
  var maxV = document.getElementById('eff' + capType + 'MaxSizeVal');
  var imgs = document.getElementById('eff' + capType + 'Images');
  var clr = document.getElementById('eff' + capType + 'Clear');

  if (chk) chk.onchange = function() { cfg.effects[type].enabled = chk.checked; preloadImages(cfg.effects[type].images, function() { initEffect(type); }); };
  if (cnt) cnt.oninput = function() { cfg.effects[type].count = parseInt(cnt.value, 10); if (cntVal) cntVal.textContent = cfg.effects[type].count; initEffect(type); };
  if (spdI) spdI.oninput = function() {
    var v = parseFloat(spdI.value); if (!isFinite(v)) v = 1;
    cfg.effects[type].speed = v;
    if (spdV) spdV.textContent = v;
  };
  if (minI) minI.oninput = function() {
    var v = parseInt(minI.value, 10);
    cfg.effects[type].minSize = v;
    if (minV) minV.textContent = v;
    if (cfg.effects[type].maxSize < v) {
      cfg.effects[type].maxSize = v;
      if (maxI) maxI.value = v;
      if (maxV) maxV.textContent = v;
    }
    initEffect(type);
  };
  if (maxI) maxI.oninput = function() {
    var v = parseInt(maxI.value, 10);
    cfg.effects[type].maxSize = v;
    if (maxV) maxV.textContent = v;
    if (cfg.effects[type].minSize > v) {
      cfg.effects[type].minSize = v;
      if (minI) minI.value = v;
      if (minV) minV.textContent = v;
    }
    initEffect(type);
  };
  if (imgs) imgs.onchange = function(e) { handleEffectImages(type, e.target.files); e.target.value = ''; };
  if (clr) clr.onclick = function() { cfg.effects[type].images = []; initEffect(type); updateEffectInfo(type); };
  updateEffectInfo(type);
}

function extractSketchfabSrc(input) {
  input = String(input || '').trim();
  if (!input) return '';
  if (/^https?:\/\//i.test(input)) return input;
  var m = input.match(/src\s*=\s*["']([^"']+)["']/i);
  if (m && m[1]) return m[1].trim();
  return '';
}

function detectBtnPreset(x, y) {
  var presets = {center:[50,50], top:[50,12], bottom:[50,88], left:[15,50], right:[85,50]};
  for (var k in presets) {
    if (Math.abs(presets[k][0] - x) < 0.5 && Math.abs(presets[k][1] - y) < 0.5) return k;
  }
  return 'custom';
}

function applyModel3DBtn() {
  var b = cfg.model3D;
  var btn = document.getElementById('model3DBtn');
  if (!btn) return;
  var inner = document.getElementById('model3DBtnInner');

  if (!b.enabled || !b.btnEnabled) {
    btn.classList.remove('active');
    btn.removeAttribute('href');
    return;
  }

  btn.classList.add('active');

  if (inner) {
    inner.textContent = b.btnText || 'Перейти';
    var fs = (b.btnFontSize !== undefined && b.btnFontSize !== null) ? b.btnFontSize : 16;
    inner.style.fontSize = Math.max(8, Math.min(300, fs)) + 'px';
    inner.style.textAlign = b.btnTextAlign || 'center';
    inner.style.color = b.btnTextColor || '#111111';
    inner.style.textShadow = b.btnTextOnly
      ? '0 1px 3px rgba(0,0,0,0.9),0 0 12px rgba(0,0,0,0.75)'
      : 'none';
  }

  btn.style.width = Math.max(40, b.btnWidth) + 'px';
  btn.style.height = Math.max(24, b.btnHeight) + 'px';
  btn.style.borderRadius = Math.max(0, b.btnRadius) + 'px';
  btn.style.left = b.btnPosX + '%';
  btn.style.top = b.btnPosY + '%';
  btn.style.transform = 'translate(-50%, -50%)';
  btn.style.cursor = b.btnLink ? 'pointer' : 'grab';

  if (b.btnTextOnly) {
    btn.style.background = 'transparent';
    btn.style.boxShadow = 'none';
    btn.style.opacity = '1';
    btn.style.padding = '4px';
  } else {
    btn.style.background = b.btnBgColor || '#ffdb4d';
    btn.style.boxShadow = '0 6px 24px rgba(0,0,0,.4)';
    btn.style.opacity = (b.btnOpacity / 100).toFixed(2);
    btn.style.padding = '6px 14px';
  }

  if (b.btnLink) {
    btn.setAttribute('href', b.btnLink);
    btn.setAttribute('target', '_blank');
    btn.setAttribute('rel', 'noopener');
  } else {

var btnDragState = null;
var _btnSuppressClick = false;

(function(){
  var btn = document.getElementById('model3DBtn');
  if (!btn) return;

  btn.addEventListener('pointerdown', function(e){
    if (!cfg.model3D || !cfg.model3D.enabled || !cfg.model3D.btnEnabled) return;
    e.preventDefault();
    e.stopPropagation();
    btnDragState = {
      pointerId: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      startPX: cfg.model3D.btnPosX, startPY: cfg.model3D.btnPosY,
      moved: false
    };
    btn.classList.add('dragging');
    try { btn.setPointerCapture(e.pointerId); } catch(err){}
  });

  btn.addEventListener('pointermove', function(e){
    if (!btnDragState || btnDragState.pointerId !== e.pointerId) return;
    var dx = e.clientX - btnDragState.startX;
    var dy = e.clientY - btnDragState.startY;
    if (!btnDragState.moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
      btnDragState.moved = true;
    }
    if (btnDragState.moved) {
      var w = window.innerWidth, h = window.innerHeight;
      var newPX = btnDragState.startPX + (dx / w) * 100;
      var newPY = btnDragState.startPY + (dy / h) * 100;
      var halfWpct = (cfg.model3D.btnWidth / w) * 50;
      var halfHpct = (cfg.model3D.btnHeight / h) * 50;
      if (halfWpct > 49) halfWpct = 0;
      if (halfHpct > 49) halfHpct = 0;
      newPX = Math.max(halfWpct, Math.min(100 - halfWpct, newPX));
      newPY = Math.max(halfHpct, Math.min(100 - halfHpct, newPY));
      cfg.model3D.btnPosX = newPX;
      cfg.model3D.btnPosY = newPY;
      btn.style.left = newPX + '%';
      btn.style.top = newPY + '%';
    }
  });

  btn.addEventListener('pointerup', function(e){
    if (!btnDragState || btnDragState.pointerId !== e.pointerId) return;
    _btnSuppressClick = btnDragState.moved;
    btnDragState = null;
    btn.classList.remove('dragging');
    try { btn.releasePointerCapture(e.pointerId); } catch(err){}
    if (_btnSuppressClick) {
      e.preventDefault();
      e.stopPropagation();
      var sel = document.getElementById('model3DBtnPos');
      if (sel) sel.value = 'custom';
    }
  });

  btn.addEventListener('pointercancel', function(e){
    if (!btnDragState) return;
    btnDragState = null;
    btn.classList.remove('dragging');
  });

  btn.addEventListener('click', function(e){
    if (_btnSuppressClick) {
      e.preventDefault();
      e.stopPropagation();
      _btnSuppressClick = false;
      return;
    }
    if (!cfg.model3D || !cfg.model3D.btnLink) {
      e.preventDefault();
    }
  });
})();
